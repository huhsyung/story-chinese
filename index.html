<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스토리 중국어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: 교재형 학습 앱 — 상단 메뉴, 한 화면에 한 단계, 차시 진행 표시줄 */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --surface2:#eef2f1; --line:#d9e1df;
  --ink:#16302b; --sub:#5b6e69; --accent:#0f7a63; --accent-soft:#e1f2ec;
  --seal:#c0392b; --seal-soft:#fbe9e6; --warn:#a86a00; --warn-soft:#fff3d9;
  --py:#2a5bb8; --stage:#dfe9ec;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17211e; --surface2:#1e2a27; --line:#2c3a36;
  --ink:#e4efec; --sub:#9cb0aa; --accent:#3cc19c; --accent-soft:#163a31;
  --seal:#ef6b5c; --seal-soft:#3a1d19; --warn:#f0b54a; --warn-soft:#3a2d12;
  --py:#86aaf0; --stage:#1c2a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17211e; --surface2:#1e2a27; --line:#2c3a36;
  --ink:#e4efec; --sub:#9cb0aa; --accent:#3cc19c; --accent-soft:#163a31;
  --seal:#ef6b5c; --seal-soft:#3a1d19; --warn:#f0b54a; --warn-soft:#3a2d12;
  --py:#86aaf0; --stage:#1c2a2e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.zh{font-family:var(--f-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--sub)}
.label{font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:19px;font-weight:700}
.sealmark{width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-zh);font-size:15px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--sub);font-weight:500}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.modechip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--surface)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.view{padding-top:24px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px;color:var(--sub)}
.icon-btn.on{border-color:var(--py);color:var(--py)}

/* home */
.cover{position:relative;margin:0;border-radius:14px;overflow:hidden;background:#cfe3f3}
.cover img{display:block;width:100%;height:auto;max-height:72vh;object-fit:cover;object-position:center 55%;opacity:0;transition:opacity .8s ease}
.cover.loaded img{opacity:1}
.cover figcaption{position:absolute;left:0;right:0;bottom:0;padding:60px 24px 22px;text-align:center;background:linear-gradient(to top,rgba(20,28,40,.75),rgba(20,28,40,0));color:#fff}
.apptitle{display:block;margin:0;color:#fff;font-weight:800;letter-spacing:.02em;line-height:1.15;font-size:clamp(34px,7vw,64px);text-shadow:0 3px 14px rgba(0,0,0,.5);word-break:keep-all}
.tagline{display:block;margin:10px 0 0;color:#fff;font-weight:600;font-size:clamp(17px,2.6vw,24px);text-shadow:0 2px 8px rgba(0,0,0,.5);word-break:keep-all}
.tagline span{color:#ffd7a8}
.apptitle,.tagline,.splash .dialog{opacity:0;transform:translateY(12px);transition:opacity 2s ease,transform 2s ease}
.show .apptitle,.show2 .tagline,.show2 .dialog{opacity:1;transform:none}
.splash{position:fixed;inset:0;z-index:50;background:#cfe3f3;overflow:auto}
.splash>img{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;opacity:0;transition:opacity .8s ease}
.splash::after{content:"";position:fixed;inset:0;background:linear-gradient(to bottom,rgba(20,28,40,.2),rgba(20,28,40,.65));opacity:0;transition:opacity .8s ease}
.splash .inner{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:24px;padding:24px 16px 6vh;text-align:center}
.splash.loaded>img,.splash.loaded::after{opacity:1}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero .intro{padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero .intro h1 span{color:var(--seal)}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.next .label{color:inherit;opacity:.7}
.next .btn{background:var(--accent);align-self:flex-start}
.progressbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.flow{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.flow span{padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--sub)}

/* lessons list */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.lesson .no{font-family:var(--f-display);font-size:13px;color:var(--seal);font-weight:700}
.lesson.locked{opacity:.55;cursor:default}
.lesson .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:auto}
.badge{font-size:11px;border-radius:20px;padding:2px 8px;font-weight:700}
.badge.done{background:var(--accent-soft);color:var(--accent)}
.badge.soon{background:var(--surface2);color:var(--sub)}
.badge.open{background:var(--seal-soft);color:var(--seal)}

/* stepper */
.stepper{display:flex;gap:4px;margin:4px 0 18px;overflow-x:auto}
.stepper div{flex:1;min-width:64px;font-size:12px;text-align:center;color:var(--sub)}
.stepper div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:5px}
.stepper div.done::before{background:var(--accent)}
.stepper div.cur{color:var(--ink);font-weight:700}
.stepper div.cur::before{background:var(--seal)}
.lessonhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* goal */
.goal-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.goal-list li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface2)}
.goal-list b{color:var(--accent)}
.grammar{border-left:4px solid var(--seal);padding:12px 16px;background:var(--seal-soft);border-radius:0 10px 10px 0}
.grammar .zh{font-size:22px;font-weight:700}

/* prep cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.card .zh{font-size:20px;font-weight:700}
.py{color:var(--py);font-size:14px}
.card .row{margin-top:6px}

/* story stage */
.story{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--stage);aspect-ratio:4/3;max-width:100%}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .char{transition:transform .5s ease, opacity .5s ease}
.stage .char.enter{transform:translateX(60px);opacity:0}
.stage .placetag{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--ink);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.prop{position:absolute;right:12px;bottom:12px;background:#fffdf7;color:#1d2a27;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;text-align:center;border:0;transform:rotate(2deg)}
.prop .zh{font-size:15px;font-weight:700;line-height:1.4;display:block}
.prop small{color:#6a6a6a}
.scenebox{display:flex;flex-direction:column;gap:12px;min-width:0}
.sit{background:var(--warn-soft);border-radius:10px;padding:10px 14px}
.sit .label{color:var(--warn)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px}
.bubble .who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:6px}
.bubble .line{font-size:22px;font-weight:700;min-height:1.4em}
.bubble .tr{font-size:13px;color:var(--sub);margin-top:4px}
.frame{font-size:14px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 12px;align-self:flex-start}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:12px;font-size:17px;font-family:var(--f-zh);background:var(--surface);color:var(--ink)}
.answer input:focus{border-color:var(--accent);outline:none}
.hintbox{border:1px dashed var(--py);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.hintbox b{color:var(--py)}
.result{border-radius:10px;padding:10px 14px;font-size:14px}
.result.ok{background:var(--accent-soft);color:var(--accent)}
.result.no{background:var(--seal-soft);color:var(--seal)}
.attempts{font-size:12px;color:var(--sub)}

/* ending */
.ending{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.teaser{background:var(--ink);color:var(--bg);border-radius:12px;padding:16px}

/* feedback table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:700}
td .zh{font-size:16px}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:2px 8px;font-weight:700}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.y{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--seal-soft);color:var(--seal)}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left}
.choice.right{border-color:var(--accent);background:var(--accent-soft)}
.choice.wrong{border-color:var(--seal);background:var(--seal-soft)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:48px}
.tile{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 14px;font-family:var(--f-zh);font-size:18px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:6px;min-height:52px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* achieve */
.achieve{display:flex;flex-direction:column;gap:10px}
.ach{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.stamp{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-zh);font-weight:700;flex:none}
.stamp.y{background:var(--seal);color:#fff;transform:rotate(-8deg)}
.stamp.n{border:2px dashed var(--line);color:var(--sub)}
.scorebig{font-family:var(--f-display);font-size:40px;font-variant-numeric:tabular-nums}

/* record */
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.exprs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.expr{padding:10px 12px;border-radius:10px;background:var(--surface2)}

/* onboarding + modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--surface);border-radius:16px;padding:24px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.dialog input[type=text]{border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--surface);color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg small{display:block;color:var(--sub);font-size:12px;line-height:1.4}
.bigprop{background:#fffdf7;color:#1d2a27;border-radius:14px;padding:28px;text-align:center}
.bigprop .zh{font-size:30px;font-weight:700;line-height:1.5;display:block}

@media (max-width:760px){
  .hero,.story,.ending{grid-template-columns:1fr}
  h1{font-size:24px}
  nav{margin-left:0;width:100%}
  .bubble .line{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* speaking */
.speak{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.speakrow{display:flex;align-items:center;gap:14px}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--seal);color:#fff;font-size:26px;flex:none;display:grid;place-items:center;box-shadow:0 4px 14px rgba(192,57,43,.3)}
.mic.rec{animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.45;box-shadow:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 12px rgba(192,57,43,0)}}
.speakinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .1s linear}
.timer.late i{background:var(--seal)}
.countdown{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;font-weight:700;color:#fff;background:var(--seal);animation:pop .3s ease}
@keyframes pop{from{transform:scale(1.4);opacity:.3}to{transform:scale(1);opacity:1}}
.heard{font-family:var(--f-zh);font-size:18px;min-height:1.5em;color:var(--ink)}
.heard:empty::before{content:"말하면 여기에 들린 말이 나타나요";font-family:var(--f-body);font-size:13px;color:var(--sub)}
.linkbtn{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline;font-size:13px;align-self:flex-start}
.note{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.result.rude{background:var(--warn-soft);color:var(--warn)}
</style>
</head><body>

<header class="top"><div class="wrap">
  <div class="brand"><span class="sealmark">说</span>스토리 중국어</div>
  <nav id="nav">
    <button data-go="home">홈</button>
    <button data-go="lessons">학습하기</button>
    <button data-go="record">나의 학습</button>
  </nav>
  <button class="modechip" id="modechip" title="학습 모드 바꾸기">초급 모드</button>
  <button class="modechip" id="userchip" hidden title="로그아웃"></button>
</div></header>

<main class="wrap" id="app"></main>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ================= 콘텐츠 ================= */
const LESSONS=[
 {no:1,title:"도착",goal:"목적지 말하기, 잘못된 것 바로잡기"},
 {no:2,title:"룸메이트",goal:"자기소개, 정중하게 부탁하기"},
 {no:3,title:"첫 수업 지각",goal:"신분 밝히기, 늦은 이유 설명하고 사과하기"},
 {no:4,title:"감기",goal:"아픈 곳과 증상, 시작된 때 말하기"},
 {no:5,title:"불량품",goal:"문제 설명하고 환불 요청하기"},
 {no:6,title:"룸메이트 전쟁",goal:"불편 말하고 규칙 제안하기"},
 {no:7,title:"단톡방 소동",goal:"오해 바로잡기"},
 {no:8,title:"면접",goal:"경험과 장점 말하기"},
 {no:9,title:"첫 근무",goal:"주문 받기, 불만 응대하기"},
 {no:10,title:"선배와의 약속",goal:"약속 정하고 시간 조율하기"},
 {no:11,title:"조별 과제",goal:"의견 내고 역할 나누기"},
 {no:12,title:"학기 마지막 날",goal:"감사와 작별 인사"}
];
const SURNAMES=[["김","金","Jīn"],["이","李","Lǐ"],["박","朴","Piáo"],["최","崔","Cuī"],["정","郑","Zhèng"],["강","姜","Jiāng"],["조","赵","Zhào"],["윤","尹","Yǐn"],["장","张","Zhāng"],["임","林","Lín"],["한","韩","Hán"],["오","吴","Wú"],["서","徐","Xú"],["신","申","Shēn"],["권","权","Quán"],["황","黄","Huáng"],["안","安","Ān"],["송","宋","Sòng"],["유","柳","Liǔ"],["홍","洪","Hóng"],["전","全","Quán"],["고","高","Gāo"],["문","文","Wén"],["양","杨","Yáng"],["손","孙","Sūn"],["배","裴","Péi"],["백","白","Bái"],["허","许","Xǔ"],["남","南","Nán"],["심","沈","Shěn"],["노","卢","Lú"],["하","河","Hé"],["곽","郭","Guō"],["성","成","Chéng"],["차","车","Chē"],["주","朱","Zhū"],["우","禹","Yǔ"],["민","闵","Mǐn"],["나","罗","Luó"],["진","陈","Chén"],["지","池","Chí"],["엄","严","Yán"],["원","元","Yuán"],["방","方","Fāng"],["공","孔","Kǒng"],["여","吕","Lǚ"]];

const EPS={
1:{
 no:1,title:"도착",

function speak(text,slow,who){
  try{
    const synth=window.speechSynthesis; if(!synth) return;
    synth.cancel();
    const u=new SpeechSynthesisUtterance(F(text).replace(/_+/g,"").replace(/○/g,""));
    u.lang="zh-CN";
    const cv=(CHARS[who]||{}).voice;
    u.rate=slow?0.55:(S.mode==="beginner"?0.75:1)*(cv?cv.rate:1);
    if(cv) u.pitch=cv.pitch;
    const vs=synth.getVoices();
    const zh=vs.filter(v=>/zh[-_]CN/i.test(v.lang)); const all=zh.length?zh:vs.filter(v=>/^zh/i.test(v.lang));
    const want=cv&&cv.gender==="m"?MALE_V:cv&&cv.gender==="f"?FEMALE_V:null;
    const v=(want&&all.find(v=>want.test(v.name)))||all[0];
    if(v) u.voice=v;
    synth.speak(u);
  }catch(e){}
}

const $=s=>document.querySelector(s);
const app=$("#app"), layer=$("#layer");
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(t){return t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z一-鿿]/g,"")}
function judge(sc,text){
  const n=norm(text);
  if(sc.check) return sc.check(n);
  return sc.keys.some(k=>n.includes(norm(k)))?"pass":"fail";
}
const isBeg=()=>S.mode==="beginner";
const modeLabel=()=>isBeg()?"초급 모드":"중급 모드";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const epDone=n=>!!(S.eps[n]&&S.eps[n].done);
const epOpen=n=>!!EPS[n]&&(n===1||epDone(n-1));

let route="home";
function go(r){stopListening(true);route=r;render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-go]");if(b) go(b.dataset.go)});
$("#modechip").addEventListener("click",()=>openSetup(true));
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",(b.dataset.go===route||(route==="lesson"&&b.dataset.go==="lessons"))?"page":"false"));
  $("#modechip").textContent=modeLabel();
  const tb=document.querySelector('#nav [data-go="teacher"]');
  if(isTeacher()&&!tb){const b=document.createElement("button");b.dataset.go="teacher";b.textContent="교사용";$("#nav").appendChild(b);}
  const uc=$("#userchip");
  if(uc){ if(isCloud()){uc.hidden=false;uc.textContent=(S.name||user.email)+" · 로그아웃";} else uc.hidden=true; }
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",(b.dataset.go===route||(route==="lesson"&&b.dataset.go==="lessons"))?"page":"false"));
  ({home:renderHome,lessons:renderLessons,record:renderRecord,lesson:renderLesson,teacher:renderTeacher})[route]();
}

function renderHome(){
  const doneCount=Object.keys(S.eps).filter(n=>epDone(n)).length;
  const pct=Math.round(doneCount/12*100);
  const n=nextEp();
  const nl=n?LESSONS[n-1]:LESSONS[Object.keys(EPS).length]||LESSONS[11];
  app.innerHTML=`<section class="view stack">
   <figure class="cover" id="cover">
    <img src="${COVER_IMG}" alt="중국 대학 정문 앞에 캐리어를 끌고 도착한 학생">
    <figcaption><h1 class="apptitle">스토리 중국어</h1><p class="tagline">이야기 속에서 <span>말하며</span> 배우는 중국어</p></figcaption>
   </figure>
   <div class="hero">
    <div class="intro">
      <span class="label">한국 대학생의 중국 유학 첫 학기 · 12차시</span>
      <p class="muted">한 화가 수업 한 차시예요. 예습한 표현을 이야기 속 인물에게 직접 말해 보고, 피드백과 복습으로 마무리해요.</p>
      <div class="flow"><span>학습 목표</span><span>예습</span><span>말하기 실전</span><span>피드백</span><span>복습 퀴즈</span><span>성취 확인</span></div>
    </div>
    <div class="next">
      <span class="label">${n?"이번에 학습할 화":"다음 학습"}</span>
      <h2>${nl.no}화 ${nl.title}</h2>
      <p>목표: ${nl.goal}${n?"":" (준비 중)"}</p>
      ${n?`<button class="btn" data-act="start">학습 시작하기</button>`:`<button class="btn" data-act="list">학습 목록 보기</button>`}
    </div>
   </div>
   <div class="grid2">
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h3>학기 진도</h3><span class="muted">${doneCount} / 12화 · ${pct}%</span></div>
      <div class="progressbar"><i style="width:${Math.max(pct,2)}%"></i></div>
      <p class="muted" style="font-size:13px">1~6화는 초급 표현, 7~12화는 중급 표현으로 이어져요.</p>
    </div>
    <div class="panel stack">
      <h3>최근 배운 표현</h3>
      ${S.expressions.length?S.expressions.slice(-3).reverse().map(x=>`<div><span class="zh" style="font-size:17px;font-weight:700">${x[0]}</span> <span class="muted" style="font-size:13px">${x[2]}</span></div>`).join(""):`<p class="muted">1화를 마치면 배운 표현이 여기에 모여요.</p>`}
    </div>
   </div>
  </section>`;
  // 표지 그림이 뜬 뒤 1초 후 소개 문구가 천천히 나타남
  revealCover($("#cover"));
  const s=app.querySelector('[data-act="start"]'); if(s) s.onclick=()=>startLesson(n);
  const l=app.querySelector('[data-act="list"]'); if(l) l.onclick=()=>go("lessons");
}

// 그림이 먼저 뜨고 → 1초 후 앱 제목 → 다시 1초 후 소개 문구가 천천히 나타나게
function revealCover(el){
  const img=el.querySelector("img");
  const go=()=>{el.classList.add("loaded");setTimeout(()=>el.classList.add("show"),1000);setTimeout(()=>el.classList.add("show2"),2000)};
  const fail=()=>el.classList.add("loaded","show","show2");
  if(img.complete) (img.naturalWidth?go():fail()); else{img.onload=go;img.onerror=fail}
}

/* ================= 학습하기 ================= */
function renderLessons(){
  app.innerHTML=`<section class="view stack">
   <div><h2>학습하기</h2><p class="muted">시즌 1 · 중국에서의 첫 학기. 앞 화를 마치면 다음 화가 열려요.</p></div>
   <div class="lessons">${LESSONS.map(l=>{
     const has=!!EPS[l.no], open=epOpen(l.no), done=epDone(l.no);
     const badge=done?'<span class="badge done">완료</span>':open?'<span class="badge open">학습 가능</span>':has?'<span class="badge soon">앞 화를 마치면 열림</span>':'<span class="badge soon">준비 중</span>';
     return `<button class="lesson ${open?'':'locked'}" ${open?`data-ep="${l.no}"`:'aria-disabled="true"'}>
       <span class="no">${l.no}화</span><h3>${l.title}</h3><span class="muted" style="font-size:13px">${l.goal}</span>
       <span class="meta"><span>약 12분</span>${badge}</span></button>`}).join("")}</div>
   <div><h2>등장인물</h2><p class="muted">이야기 속에서 만나는 사람들이에요.</p></div>
   <div class="cards">${["driver","chen","li","wang"].map(k=>{const c=CHARS[k];return `
    <div class="card"><svg viewBox="130 110 540 490" style="width:100%;height:170px;background:var(--surface2);border-radius:10px" role="img" aria-label="${c.name}">${person(k,"normal")}</svg>
     <h3><span class="zh">${c.name}</span> <span class="muted" style="font-size:13px;font-weight:400">${c.py} · ${c.age}</span></h3>
     <span class="muted" style="font-size:13px">${c.role}</span>
     <span style="font-size:14px">${c.look}. ${c.personality}.</span></div>`}).join("")}</div>
   </section>`;
  app.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>startLesson(+b.dataset.ep));
}

/* ================= 나의 학습 ================= */
function tagFor(l){
  const extra=l.rude?' <span class="tag y">명령조 주의</span>':"";
  if(l.how==="first") return '<span class="tag g">첫 시도 통과</span>'+extra;
  if(l.how==="retry") return '<span class="tag y">다시 시도해서 통과</span>'+extra;
  return '<span class="tag r">모범 답안 보고 통과</span>'+extra;
}
function renderRecord(){
  const nums=Object.keys(EPS).map(Number);

  app.innerHTML=`<section class="view stack">

   <div class="grid2">
    <div class="panel row" style="justify-content:space-around">

   </div>
   ${doneNums.length?doneNums.map(n=>{const r=S.eps[n],ep=EPS[n];return `
   <div class="panel stack">
    <div class="row" style="justify-content:space-between"><h3>${n}화 ${ep.title} · ${r.date}</h3><span class="row" style="gap:6px"><span class="tag ${r.ending==="A"?"g":"y"}">결말 ${r.ending}</span><span class="tag g">실전 ${r.last}점 · 복습 ${r.quiz}/4</span></span></div>
    <div class="tablewrap"><table><thead><tr><th>장면</th><th>내가 한 말</th><th>결과</th><th>힌트</th></tr></thead><tbody>
     ${r.log.map((l,i)=>`<tr><td>${i+1}. ${ep.scenes[i].goal}</td><td class="zh">${esc(l.answer)}${l.typed?' <span class="muted" style="font-size:12px">(입력)</span>':""}</td><td>${tagFor(l)}</td><td>${l.hints}회</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row"><span class="label">학습 목표</span>${ep.goals.map((g,i)=>`<span class="tag ${r.achieved[i]?"g":"y"}">${r.achieved[i]?"달성":"연습 필요"} · ${g}</span>`).join("")}</div>
    <button class="btn ghost" data-again="${n}" style="align-self:flex-start">${n}화 다시 학습하기</button>
   </div>`}).join(""):`<div class="panel"><p class="muted">아직 마친 화가 없어요. 1화부터 시작해 보세요.</p></div>`}
   <div class="panel stack"><h3>나만의 표현장</h3>
    ${S.expressions.length?`<div class="exprs">${S.expressions.map(x=>`<div class="expr"><div class="zh" style="font-size:17px;font-weight:700">${x[0]}</div><div class="py">${x[1]}</div><div class="muted" style="font-size:13px">${x[2]}</div></div>`).join("")}</div>`:`<p class="muted">학습을 마치면 표현이 자동으로 저장돼요.</p>`}
   </div>
  </section>`;
  app.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>startLesson(+b.dataset.again));
}

/* ================= 차시 진행 ================= */
const STEPS=["목표","예습","실전","피드백","복습","성취"];
const GRS=()=>[].concat(EP.grammar);
let L=null, EP=null;
function startLesson(n){
  EP=EPS[n];
  L={ep:n,step:0,scene:0,attempts:0,hintLevel:0,hintsUsed:0,showModel:false,rude:false,log:[],quizIdx:0,quizScore:0,quizState:null,ending:null};
  route="lesson";render();window.scrollTo(0,0);
}
const stepper=()=>`<div class="stepper" aria-label="학습 단계">${STEPS.map((s,i)=>`<div class="${i<L.step?"done":i===L.step?"cur":""}">${s}</div>`).join("")}</div>`;
const lessonHead=()=>`<div class="lessonhead"><h2><span style="color:var(--seal)">${EP.no}화</span> ${EP.title}</h2><span class="muted" style="font-size:13px">${modeLabel()} · 약 12분</span></div>${stepper()}`;
function renderLesson(){[stepGoal,stepPrep,stepStory,stepFeedback,stepQuiz,stepDone][L.step]()}
function nextStep(){L.step++;render();window.scrollTo(0,0)}

function stepGoal(){
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="panel stack"><span class="label">이번 차시를 마치면</span>
    <ul class="goal-list">${EP.goals.map((g,i)=>`<li><b>${i+1}</b><span>${g}</span></li>`).join("")}</ul></div>
   ${GRS().map((g,i,a)=>`<div class="grammar stack" style="gap:6px"><span class="label" style="color:var(--seal)">문법 포인트${a.length>1?" "+(i+1):""}</span>
    <span class="zh">${g.pattern}</span><span class="py">${g.py}</span><span>${g.ko}</span></div>`).join("")}
   <div class="panel"><p class="muted">이야기: ${EP.intro}</p></div>
   <div class="row"><button class="btn" id="go">예습 시작</button></div>
  </section>`;
  $("#go").onclick=nextStep;
}
function stepPrep(){
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div><h3>핵심 표현 ${EP.prep.length}개</h3><p class="muted">듣고 소리 내어 따라 말해 보세요. 이 표현을 이야기 속에서 말로 쓰게 돼요.</p></div>
   <div class="cards">${EP.prep.map((p,i)=>`
    <div class="card"><span class="zh">${F(p[0])}</span><span class="py">${F(p[1])}</span><span class="muted">${F(p[2])}</span>
     <div class="row"><button class="icon-btn" data-say="${i}">🔊 듣기</button><button class="icon-btn" data-slow="${i}">느리게</button></div></div>`).join("")}</div>
   ${GRS().map((g,gi,a)=>`<div class="grammar stack" style="gap:8px"><span class="label" style="color:var(--seal)">문법 포인트${a.length>1?" "+(gi+1):""} · ${g.pattern}</span>
    <p>${g.note}</p>
    ${g.ex.map((e,i)=>`<div><span class="zh" style="font-size:18px">${e[0]}</span> <button class="icon-btn" data-ex="${gi}-${i}">🔊</button><br><span class="py">${e[1]}</span> · <span class="muted">${e[2]}</span></div>`).join("")}</div>`).join("")}
   <div class="row"><button class="btn ghost" id="back">이전</button><button class="btn" id="go">스토리 시작</button></div>
  </section>`;
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(EP.prep[b.dataset.say][0]));
  app.querySelectorAll("[data-slow]").forEach(b=>b.onclick=()=>speak(EP.prep[b.dataset.slow][0],true));
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const [gi,i]=b.dataset.ex.split("-");speak(GRS()[gi].ex[i][0])});
  $("#back").onclick=()=>{L.step--;render()};
  $("#go").onclick=nextStep;
}

/* ---------- 스토리 ---------- */
let showPy=null, showKo=null;
const LIMIT=10;
function stepStory(){
  if(L.ending) return renderEnding();
  const sc=EP.scenes[L.scene];
  if(showPy===null){showPy=isBeg();showKo=isBeg();}
  const maxHint=isBeg()?3:2;
  const canSpeak=!!SR && !S.typeMode;
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="story">
    <div class="stage">${stageSVG(sc,sc.expr||"normal",true)}
      <span class="placetag">장면 ${L.scene+1} / ${EP.scenes.length} · ${sc.place}</span>
      <button class="prop" id="prop" aria-label="${sc.prop.ko} 크게 보기"><span class="zh">${F(sc.prop.zh)}</span><small>${sc.prop.ko} · 탭해서 보기</small></button>
    </div>
    <div class="scenebox">
     <div class="sit"><span class="label">상황</span><p>${sc.sit}</p></div>
     <div class="bubble">
      <div class="who"><span>${F(sc.who)}</span>
       <span class="row" style="gap:6px"><button class="icon-btn ${showPy?"on":""}" id="tpy">병음</button><button class="icon-btn ${showKo?"on":""}" id="tko">뜻</button><button class="icon-btn" id="say">🔊 듣기</button><button class="icon-btn" id="slow">느리게</button></span></div>
      <div class="line zh" id="line" aria-live="polite"></div>
      <div class="py" id="py" ${showPy?"":"hidden"}>${F(sc.py)}</div>
      <div class="tr" id="ko" ${showKo?"":"hidden"}>${F(sc.ko)}</div>
     </div>
     <div class="label">나의 목표 · ${sc.goal}</div>
     ${isBeg()?`<div class="frame zh">문장 틀: ${F(sc.frame)}</div>`:""}
     <div id="hint"></div>
     ${canSpeak?`
     <div class="speak" id="speakbox">
      <div class="speakrow">
       <button class="mic" id="mic" aria-label="말하기 시작">🎤</button>
       <div class="speakinfo">
        <span class="label" id="miclabel">마이크를 누르고 중국어로 말하세요 · 10초</span>
        <div class="timer" id="timer"><i id="timerbar"></i></div>
        <div class="heard" id="heard" aria-live="polite"></div>
       </div>
       <div id="cd"></div>
      </div>
      <button class="linkbtn" id="totype" type="button">말하기가 안 되면 입력해서 답하기</button>
     </div>`:`
     ${!SR?`<div class="note">이 브라우저는 음성 인식을 지원하지 않아요. 크롬이나 엣지에서 열면 말로 답할 수 있어요. 지금은 입력으로 답해 주세요.</div>`:""}
     <form class="answer" id="form"><input id="ans" type="text" autocomplete="off" placeholder="중국어로 입력 (병음도 가능)" aria-label="답변 입력"><button class="btn" type="submit">제출</button></form>
     ${SR?`<button class="linkbtn" id="tospeak" type="button">말로 답하기로 돌아가기</button>`:""}`}
     <div class="row" style="justify-content:space-between">
      <button class="btn soft" id="hintbtn" type="button">💡 힌트</button>
      <span class="attempts" id="att">시도 ${L.attempts}회 · 힌트 ${L.hintsUsed}회</span>
     </div>
     <div id="res"></div>
    </div>
   </div>
  </section>`;
  requestAnimationFrame(()=>{const c=$("#charlayer");if(c)c.classList.remove("enter")});
  typeLine(F(sc.line));
  setTimeout(()=>speak(sc.line,false,sc.char),350);
  $("#tpy").onclick=()=>{showPy=!showPy;$("#py").hidden=!showPy;$("#tpy").classList.toggle("on",showPy)};
  $("#tko").onclick=()=>{showKo=!showKo;$("#ko").hidden=!showKo;$("#tko").classList.toggle("on",showKo)};
  $("#say").onclick=()=>speak(sc.line,false,sc.char);
  $("#slow").onclick=()=>speak(sc.line,true,sc.char);
  $("#prop").onclick=()=>openProp(sc);
  $("#hintbtn").onclick=()=>{ if(L.hintLevel<maxHint){L.hintLevel++;L.hintsUsed++;drawHint();updAtt();}};
  if(canSpeak){
    $("#mic").onclick=()=>{ if(listening) stopListening(false); else startListening(); };
    $("#totype").onclick=()=>{stopListening(true);S.typeMode=true;save();stepStory()};
  }else{
    $("#form").onsubmit=e=>{e.preventDefault();const v=$("#ans").value.trim();if(v) evaluate(v,[v],true)};
    const ts=$("#tospeak"); if(ts) ts.onclick=()=>{S.typeMode=false;save();stepStory()};
  }
  drawHint();
}
function updAtt(){const a=$("#att");if(a)a.textContent=`시도 ${L.attempts}회 · 힌트 ${L.hintsUsed}회`}
function typeLine(text){
  const el=$("#line"); if(!el) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=text;return}
  let i=0; el.textContent="";
  const t=setInterval(()=>{ if(!document.body.contains(el)){clearInterval(t);return} el.textContent=text.slice(0,++i); if(i>=text.length)clearInterval(t)},70);
}
function setExpr(expr){const g=$("#charlayer"); if(g) g.innerHTML=person(EP.scenes[L.scene].char,expr).replace(/^<g[^>]*>|<\/g>$/g,"")&&person(EP.scenes[L.scene].char,expr);}
function drawHint(){
  const sc=EP.scenes[L.scene]; const box=$("#hint"); if(!box) return;
  const parts=[];
  if(L.hintLevel>=1) parts.push(`<div><b>목표</b> · ${sc.goal}. 상대의 말에 맞게 대답해 보세요.</div>`);
  if(L.hintLevel>=2) parts.push(`<div><b>핵심 표현</b> · ${isBeg()?`<span class="zh">${sc.hintWord}</span>`:sc.hintWordMid}</div>`);
  if(L.hintLevel>=3) parts.push(`<div><b>예시 문장</b> · <span class="zh">${F(sc.model)}</span> <span class="py">${F(sc.modelPy)}</span></div>`);
  if(L.showModel) parts.push(`<div><b>모범 답안</b> · <span class="zh" style="font-size:18px">${F(sc.model)}</span> <button class="icon-btn" id="modelsay">🔊</button> <span class="py">${F(sc.modelPy)}</span><br><span class="muted">모범 답안을 듣고 따라 말해 보세요.</span></div>`);
  box.innerHTML=parts.length?`<div class="hintbox">${parts.join("")}</div>`:"";
  const ms=$("#modelsay"); if(ms) ms.onclick=()=>speak(sc.model);
}

/* ---------- 음성 인식 (10초, 마지막 3초 카운트다운) ---------- */
let rec=null, listening=false, tick=null, startAt=0, finals="", interim="", alts=[], aborted=false;
function startListening(){
  if(!SR||listening) return;
  try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}
  finals=""; interim=""; alts=[]; aborted=false;
  try{ rec=new SR(); }catch(e){ micError("unsupported"); return; }
  rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=3;
  rec.onresult=e=>{
    let f="", it=""; alts=[];
    for(let i=0;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ f+=r[0].transcript; for(let j=0;j<r.length;j++) alts.push(r[j].transcript); }
      else it+=r[0].transcript;
    }
    finals=f; interim=it;
    const h=$("#heard"); if(h) h.textContent=(finals+interim);
  };
  rec.onerror=e=>{ if(e.error==="no-speech"||e.error==="aborted") return; aborted=true; micError(e.error); };
  rec.onend=()=>{ const was=listening; endUI(); if(was&&!aborted) finishSpeech(); };
  try{ rec.start(); }catch(e){ micError("start"); return; }
  listening=true; startAt=Date.now();
  const mic=$("#mic"); mic.classList.add("rec"); mic.textContent="■"; mic.setAttribute("aria-label","말하기 끝내기");
  $("#miclabel").textContent="듣고 있어요… 다 말했으면 ■를 누르세요";
  $("#heard").textContent="";
  $("#res").innerHTML="";
  tick=setInterval(()=>{
    const left=LIMIT-(Date.now()-startAt)/1000;
    const bar=$("#timerbar"), tm=$("#timer"), cd=$("#cd");
    if(!bar){clearInterval(tick);return}
    bar.style.transform=`scaleX(${Math.max(0,left/LIMIT)})`;
    if(left<=3&&left>0){
      tm.classList.add("late");
      const n=Math.ceil(left);
      if(cd.dataset.n!==String(n)){cd.dataset.n=n;cd.innerHTML=`<div class="countdown" aria-live="assertive">${n}</div>`;}
    }
    if(left<=0) stopListening(false);
  },100);
}
function stopListening(silent){
  if(!listening) return;
  if(silent) aborted=true;
  try{rec&&rec.stop()}catch(e){}
  clearInterval(tick);
  setTimeout(()=>{ if(listening){ const was=!aborted; endUI(); if(was) finishSpeech(); } },1500);
}
function endUI(){
  listening=false; clearInterval(tick);
  const mic=$("#mic"); if(mic){mic.classList.remove("rec");mic.textContent="🎤";mic.setAttribute("aria-label","말하기 시작")}
  const cd=$("#cd"); if(cd){cd.innerHTML="";delete cd.dataset.n}
  const tm=$("#timer"); if(tm) tm.classList.remove("late");
  const bar=$("#timerbar"); if(bar) bar.style.transform="scaleX(1)";
  const ml=$("#miclabel"); if(ml) ml.textContent="마이크를 누르고 중국어로 말하세요 · 10초";
}
function finishSpeech(){
  const said=(finals||interim).trim();
  if(!said){ $("#res").innerHTML=`<div class="result no">목소리가 들리지 않았어요. 마이크를 누르고 10초 안에 다시 말해 보세요.</div>`; return; }
  $("#heard").textContent=said;
  evaluate(said,[said,...alts],false);
}
function micError(code){
  endUI();
  const msg = code==="not-allowed"||code==="service-not-allowed"
    ? "마이크 사용이 허용되지 않았어요. 주소창 왼쪽의 자물쇠(또는 사이트 정보)에서 마이크를 '허용'으로 바꾼 뒤 다시 눌러 주세요."
    : code==="network" ? "음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나 입력으로 답해 주세요."
    : "음성 인식을 시작하지 못했어요. 다시 누르거나 입력으로 답해 주세요.";
  const r=$("#res"); if(r) r.innerHTML=`<div class="note">${msg}</div>`;
}

/* ---------- 판정 ---------- */
function evaluate(said,candidates,typed){
  const sc=EP.scenes[L.scene];
  L.attempts++; updAtt();
  let verdict="fail";
  for(const c of candidates){ const v=judge(sc,c); if(v==="pass"){verdict="pass";break} if(v==="rude") verdict="rude"; }
  const res=$("#res");
  if(verdict==="pass"){
    const how=L.showModel?"model":L.attempts===1?"first":"retry";
    L.log.push({answer:said,how,attempts:L.attempts,hints:L.hintsUsed,rude:L.rude,typed});
    setExpr("happy");
    res.innerHTML=`<div class="result ok"><b>통과!</b> ${F(sc.who)}: <span class="zh">${F(sc.pass[0])}</span> <span class="py">${F(sc.pass[1])}</span><br><span>${F(sc.pass[2])}</span></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="nextsc">${L.scene<EP.scenes.length-1?"다음 장면":"결말 보기"}</button></div>`;
    speak(sc.pass[0],false,sc.char);
    app.querySelectorAll("#mic,#form button,#form input,#hintbtn,#totype,#tospeak").forEach(b=>b.disabled=true);
    $("#nextsc").onclick=()=>{
      L.scene++; L.attempts=0; L.hintLevel=0; L.hintsUsed=0; L.showModel=false; L.rude=false;
      if(L.scene>=EP.scenes.length) L.ending=EP.endRule(L.log);
      render(); window.scrollTo(0,0);
    };
    return;
  }
  const maxHint=isBeg()?3:2;
  if(L.attempts>=3) L.showModel=true;
  else if(L.hintLevel<Math.min(L.attempts,maxHint)) L.hintLevel=Math.min(L.attempts,maxHint);
  drawHint();
  if(verdict==="rude"){
    L.rude=true; setExpr("annoyed");
    res.innerHTML=`<div class="result rude">${F(sc.who)}: <span class="zh">${sc.rude[0]}</span> <span class="py">${sc.rude[1]}</span> (${sc.rude[2]})<br>${sc.rudeTip||`명령처럼 들렸어요. <span class="zh">不好意思</span>, <span class="zh">能不能…？</span> 같은 공손한 표현을 넣어 다시 말해 보세요.`}</div>`;
    speak(sc.rude[0],false,sc.char);
  }else{
    const ch=CHARS[sc.char]||{};
    const fl=ch.fail||["请再说一遍？","Qǐng zài shuō yí biàn?","다시 말해 주시겠어요?"];
    setExpr(ch.failExpr||"confused");
    if(ch.fail) speak(fl[0],false,sc.char);
    res.innerHTML=`<div class="result no">${F(sc.who)}: <span class="zh">${fl[0]}</span> <span class="py">${fl[1]}</span> (${fl[2]})<br>${L.showModel?"모범 답안을 듣고 따라 말해 보세요.":"힌트를 보고 다시 말해 보세요."}</div>`;
  }
  const inp=$("#ans"); if(inp) inp.select();
}

function renderEnding(){
  const e=L.ending==="A"?EP.endA:EP.endB;
  const sc=EP.scenes[EP.scenes.length-1];
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="ending">
    <div class="stage">${stageSVG(sc,L.ending==="A"?"happy":(sc.char==="chen"||sc.char==="li"?"annoyed":"normal"),false)}<span class="placetag">결말 ${L.ending}</span></div>
    <div class="stack">
     <span class="label">결말 ${L.ending}</span><h2>${e.title}</h2>
     <div class="bubble"><div class="who"><span>${EP.endWho}</span><button class="icon-btn" id="say">🔊 듣기</button></div>
       <div class="line zh">${F(e.line)}</div><div class="py">${F(e.py)}</div><div class="tr">${F(e.ko)}</div></div>
     <p>${e.text}</p>
     ${L.ending==="B"?`<div class="sit"><span class="label">이렇게 말했다면</span><p>${EP.endNote}</p></div>`:""}
     <div class="teaser"><span class="label" style="color:inherit;opacity:.7">다음 화 예고</span><p style="font-weight:700">${EP.teaser}</p></div>
     <div class="row"><button class="btn" id="go">피드백 보기</button></div>
    </div>
   </div>
  </section>`;
  $("#say").onclick=()=>speak(e.line,false,sc.char);
  $("#go").onclick=nextStep;
}

/* ---------- 피드백 ---------- */
const sceneScore=l=>Math.max(0,(l.how==="first"?10:l.how==="retry"?6:2)-l.hints);
function stepFeedback(){
  const total=L.log.reduce((a,l)=>a+sceneScore(l),0);
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="row" style="justify-content:space-between"><h3>장면별 피드백</h3><span class="muted">실전 점수 <b style="font-size:20px;color:var(--ink)">${total}</b> / ${EP.scenes.length*10}</span></div>
   <div class="panel tablewrap"><table>
    <thead><tr><th>장면 · 목표</th><th>내가 한 말</th><th>더 자연스러운 표현</th><th>결과</th><th>점수</th></tr></thead>
    <tbody>${L.log.map((l,i)=>{const sc=EP.scenes[i];return `<tr>
      <td>${i+1}. ${sc.goal}</td><td class="zh">${esc(l.answer)}</td>
      <td><span class="zh">${F(sc.model)}</span> <button class="icon-btn" data-ms="${i}">🔊</button><br><span class="py">${F(sc.modelPy)}</span></td>
      <td>${tagFor(l)}<br><span class="muted" style="font-size:12px">${l.attempts}번 시도 · 힌트 ${l.hints}회</span></td>
      <td style="font-variant-numeric:tabular-nums">${sceneScore(l)}</td></tr>`}).join("")}</tbody></table></div>
   <div class="grammar stack" style="gap:6px"><span class="label" style="color:var(--seal)">문법 포인트 다시 보기</span>${GRS().map(g=>`<p>${g.review}</p>`).join("")}</div>
   <div class="row"><button class="btn" id="go">복습 퀴즈</button></div>
  </section>`;
  app.querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>speak(EP.scenes[b.dataset.ms].model));
  $("#go").onclick=nextStep;
}

/* ---------- 복습 퀴즈 ---------- */
function stepQuiz(){
  const q=EP.quiz[L.quizIdx];
  if(!L.quizState) L.quizState={answered:false,picked:[],correct:false};
  const st=L.quizState;
  let body="";
  if(q.type==="order"){
    body=`<div class="slot" aria-label="만든 문장">${st.picked.map(i=>`<span class="tile">${q.tiles[i]}</span>`).join("")||'<span class="muted">아래 낱말을 순서대로 누르세요</span>'}</div>
      <div class="tiles">${q.tiles.map((t,i)=>st.picked.includes(i)?"":`<button class="tile" data-tile="${i}" ${st.answered?"disabled":""}>${t}</button>`).join("")}</div>
      ${!st.answered&&st.picked.length?'<button class="btn soft" id="reset" style="align-self:flex-start">다시 놓기</button>':""}`;
  }else{
    body=`${q.type==="listen"?`<button class="btn ghost" id="listen" style="align-self:flex-start">🔊 문장 듣기</button>`:""}
      <div class="choices">${q.opts.map((o,i)=>{
        let cls="choice"; if(st.answered){ if(i===q.a) cls+=" right"; else if(st.picked[0]===i) cls+=" wrong"; }
        return `<button class="${cls} ${q.zh?"zh":""}" data-opt="${i}" ${st.answered?"disabled":""}>${F(o)}</button>`}).join("")}</div>`;
  }
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="panel q"><span class="label">복습 ${L.quizIdx+1} / ${EP.quiz.length}</span><h3>${F(q.q)}</h3>${body}
    ${st.answered?`<div class="result ${st.correct?"ok":"no"}">${st.correct?"정답이에요!":"정답: "+(q.type==="order"?q.answer.join(" "):F(q.opts[q.a]))}</div>
      <div class="row"><button class="btn" id="qn">${L.quizIdx<EP.quiz.length-1?"다음 문제":"성취 확인"}</button></div>`:""}
   </div></section>`;
  const ls=$("#listen"); if(ls) ls.onclick=()=>speak(q.say);
  if(q.type==="listen"&&!st.answered&&!st.spoken){st.spoken=true;setTimeout(()=>speak(q.say),300)}
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{st.answered=true;st.picked=[+b.dataset.opt];st.correct=+b.dataset.opt===q.a;if(st.correct)L.quizScore++;stepQuiz();});
  app.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{
    st.picked.push(+b.dataset.tile);
    if(st.picked.length===q.tiles.length){st.answered=true;st.correct=st.picked.map(i=>q.tiles[i]).join("")===q.answer.join("");if(st.correct)L.quizScore++;}
    stepQuiz();});
  const rs=$("#reset"); if(rs) rs.onclick=()=>{st.picked=[];stepQuiz()};
  const qn=$("#qn"); if(qn) qn.onclick=()=>{L.quizState=null; if(L.quizIdx<EP.quiz.length-1){L.quizIdx++;stepQuiz()} else {finish();nextStep()}};
}
function finish(){
  const total=L.log.reduce((a,l)=>a+sceneScore(l),0);
  const achieved=EP.goalScenes.map(i=>L.log[i].how!=="model");
  const prev=S.eps[L.ep];
  const d=new Date(); const date=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  S.eps[L.ep]={done:true,best:Math.max(total,prev&&prev.best||0),last:total,quiz:L.quizScore,ending:L.ending,log:L.log,achieved,date};
  EP.prep.forEach(p=>{const x=[F(p[0]),F(p[1]),F(p[2])]; if(!S.expressions.some(y=>y[0]===x[0])) S.expressions.push(x)});
  save();
}
function stepDone(){
  const r=S.eps[L.ep];
  const hasNext=!!EPS[L.ep+1];
  app.innerHTML=`<section class="view stack">${lessonHead()}
   <div class="grid2">
    <div class="panel stack"><span class="label">${EP.no}화 ${EP.title} · 학습 목표</span>
     <div class="achieve">${EP.goals.map((g,i)=>`<div class="ach"><span class="stamp ${r.achieved[i]?"y":"n"}">${r.achieved[i]?"达成":"练习"}</span><div><b>${g}</b><br><span class="muted" style="font-size:13px">${r.achieved[i]?"이야기 속에서 스스로 말해 냈어요.":"모범 답안의 도움을 받았어요. 다시 학습하며 연습해 보세요."}</span></div></div>`).join("")}</div></div>
    <div class="panel stack"><span class="label">이번 차시 결과</span>
     <div class="row" style="gap:28px"><div class="stat"><span class="label">실전 점수</span><span class="scorebig">${r.last}</span></div><div class="stat"><span class="label">복습 퀴즈</span><span class="scorebig">${r.quiz}/4</span></div><div class="stat"><span class="label">결말</span><span class="scorebig">${r.ending}</span></div></div>
     <p class="muted" style="font-size:13px">배운 표현 ${EP.prep.length}개가 '나만의 표현장'에 저장됐어요.</p></div>
   </div>
   <div class="row">${hasNext?`<button class="btn" id="nexte">${L.ep+1}화 시작하기</button>`:""}<button class="btn ${hasNext?"ghost":""}" id="rec">나의 학습 보기</button><button class="btn ghost" id="again">${EP.no}화 다시 학습하기</button></div>
  </section>`;
  const ne=$("#nexte"); if(ne) ne.onclick=()=>startLesson(L.ep+1);
  $("#rec").onclick=()=>go("record");
  $("#again").onclick=()=>startLesson(L.ep);
}

/* ================= 모달 ================= */
function openProp(sc){
  layer.innerHTML=`<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-label="${sc.prop.ko}">
    <div class="bigprop"><span class="zh">${F(sc.prop.zh)}</span><small>${sc.prop.ko}</small></div>
    <button class="btn" id="close">닫기</button></div></div>`;
  $("#close").onclick=()=>layer.innerHTML="";
  $("#ov").onclick=e=>{if(e.target.id==="ov")layer.innerHTML=""};
}
function openSetup(editing){
  let m=S.mode;
  const known=SURNAMES.some(s=>s[1]===S.sname);
  layer.innerHTML=`<div class="overlay"><form class="dialog" id="setup">
    <div><h2>${editing?"설정":"시작하기"}</h2><p class="muted">${editing?"학습 모드는 언제든 바꿀 수 있어요.":"이야기의 주인공은 바로 나예요."}</p></div>
    <label class="stack" style="gap:6px"><span class="label">이름</span><input type="text" id="nm" value="${esc(S.name)}" placeholder="예: 김하늘" required></label>
    <div class="row"><label class="stack" style="gap:6px;flex:1;min-width:140px"><span class="label">학과</span><input type="text" id="dp" value="${esc(S.dept||"")}" placeholder="예: 중국어과" ${isCloud()?"required":""}></label>
     <label class="stack" style="gap:6px;flex:1;min-width:140px"><span class="label">학번</span><input type="text" id="sd" value="${esc(S.sid||"")}" placeholder="예: 202612345" ${isCloud()?"required":""}></label></div>
    <label class="stack" style="gap:6px"><span class="label">내 성 (중국어) · 친구들이 小+성으로 불러요</span>
     <select id="sn" style="border:2px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--surface);color:var(--ink)">
      ${SURNAMES.map(s=>`<option value="${s[1]}|${s[2]}" ${s[1]===S.sname?"selected":""}>${s[0]} → ${s[1]} ${s[2]}</option>`).join("")}
      <option value="custom" ${known?"":"selected"}>목록에 없어요 (직접 입력)</option>
     </select></label>
    <div class="row" id="customsn" ${known?"hidden":""}><input type="text" id="snzh" value="${known?"":esc(S.sname)}" placeholder="한자 (예: 许)" style="flex:1"><input type="text" id="snpy" value="${known?"":esc(S.spy)}" placeholder="병음 (예: Xǔ)" style="flex:1"></div>
    <label class="stack" style="gap:6px"><span class="label">중국어 이름 (선택) · 자기소개할 때 써요</span>
     <div class="row"><input type="text" id="zn" value="${esc(S.zname||"")}" placeholder="한자 (예: 许成喜)" style="flex:1;min-width:120px"><input type="text" id="zp" value="${esc(S.zpy||"")}" placeholder="병음 (예: Xǔ Chéngxǐ)" style="flex:1;min-width:120px"></div></label>
    <div class="stack" style="gap:6px"><span class="label">학습 모드</span>
     <div class="seg" id="mseg">
      <button type="button" data-m="beginner" aria-pressed="${m==="beginner"}"><b>초급</b><small>병음·뜻 항상 표시, 느린 음성, 힌트 3단계, 문장 틀 제공</small></button>
      <button type="button" data-m="intermediate" aria-pressed="${m==="intermediate"}"><b>중급</b><small>병음·뜻은 눌러서 보기, 보통 속도, 힌트 2단계</small></button></div></div>
    <p class="muted" style="font-size:12px">이야기 속에서는 마이크로 말해서 답해요. 크롬이나 엣지에서 마이크 사용을 허용해 주세요.</p>
    <button class="btn" type="submit">${editing?"저장":"시작하기"}</button>
  </form></div>`;
  $("#sn").onchange=()=>{$("#customsn").hidden=$("#sn").value!=="custom"};
  $("#mseg").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;m=b.dataset.m;document.querySelectorAll("#mseg button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#setup").onsubmit=e=>{e.preventDefault();
    S.name=$("#nm").value.trim()||"학습자"; S.dept=$("#dp").value.trim(); S.sid=$("#sd").value.trim(); S.zname=$("#zn").value.trim(); S.zpy=$("#zp").value.trim();
    const v=$("#sn").value;
    if(v==="custom"){S.sname=$("#snzh").value.trim()||"金";S.spy=$("#snpy").value.trim()||"Jīn"}
    else{[S.sname,S.spy]=v.split("|")}
    S.mode=m;showPy=null;save();layer.innerHTML="";render()};
}

/* ================= 교사용 ================= */
async function renderTeacher(){
  if(!isTeacher()){go("home");return}
  app.innerHTML=`<section class="view stack"><div><h2>교사용 · 학생 학습 현황</h2><p class="muted">불러오는 중…</p></div></section>`;
  let rows=[];
  try{
    const snap=await fb.db.collection("users").get();
    snap.forEach(d=>rows.push({id:d.id,...d.data()}));
  }catch(e){
    app.innerHTML=`<section class="view stack"><h2>교사용</h2><div class="note">학생 기록을 불러오지 못했어요. Firestore 규칙에 교사 이메일이 맞게 들어갔는지 확인해 주세요.</div></section>`;return;
  }
  rows.sort((a,b)=>String(a.profile&&a.profile.sid||"").localeCompare(String(b.profile&&b.profile.sid||"")));
  const nums=Object.keys(EPS).map(Number);
  const cell=(st,n)=>{const r=st&&st.eps&&st.eps[n];return r&&r.done?`<span class="tag ${r.ending==="A"?"g":"y"}">${r.best}점 · 결말 ${r.ending}</span>`:'<span class="muted">–</span>'};
  app.innerHTML=`<section class="view stack">
   <div><h2>교사용 · 학생 학습 현황</h2><p class="muted">학생 ${rows.length}명 · 이름을 누르면 학생이 한 말을 볼 수 있어요.</p></div>
   <div class="panel tablewrap"><table><thead><tr><th>학번</th><th>이름</th><th>학과</th>${nums.map(n=>`<th>${n}화</th>`).join("")}<th>마지막 학습</th></tr></thead><tbody>
    ${rows.map((r,i)=>{const p=r.profile||{},st=r.state||{};const t=r.updatedAt&&r.updatedAt.toDate?r.updatedAt.toDate():null;
      return `<tr><td style="font-variant-numeric:tabular-nums">${esc(p.sid||"")}</td><td><button class="linkbtn" data-stu="${i}" style="font-size:14px">${esc(p.name||p.email||"(이름 없음)")}</button></td><td>${esc(p.dept||"")}</td>${nums.map(n=>`<td>${cell(st,n)}</td>`).join("")}<td>${t?`${t.getMonth()+1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`:""}</td></tr>`}).join("")||`<tr><td colspan="9" class="muted">아직 학습한 학생이 없어요.</td></tr>`}
   </tbody></table></div>
   <div id="stu"></div>
  </section>`;
  app.querySelectorAll("[data-stu]").forEach(b=>b.onclick=()=>{
    const r=rows[+b.dataset.stu],p=r.profile||{},st=r.state||{};
    $("#stu").innerHTML=`<div class="panel stack"><h3>${esc(p.name||"")} · ${esc(p.dept||"")} ${esc(p.sid||"")}</h3>
      ${nums.filter(n=>st.eps&&st.eps[n]&&st.eps[n].done).map(n=>{const e=st.eps[n];return `<div class="stack" style="gap:6px"><b>${n}화 ${EPS[n].title} · ${e.date} · 실전 ${e.last}점 · 복습 ${e.quiz}/4</b>
        <div class="tablewrap"><table><thead><tr><th>장면</th><th>학생이 한 말</th><th>결과</th></tr></thead><tbody>
        ${e.log.map((l,i)=>`<tr><td>${i+1}. ${EPS[n].scenes[i].goal}</td><td class="zh">${esc(l.answer)}</td><td>${tagFor(l)}</td></tr>`).join("")}</tbody></table></div></div>`}).join("")||'<p class="muted">아직 마친 화가 없어요.</p>'}</div>`;
    $("#stu").scrollIntoView({behavior:"smooth"});
  });
}

/* ================= 로그인 ================= */
function showLogin(err){
  layer.innerHTML=`<div class="splash${err?" loaded show show2":""}" id="splash"><img src="${COVER_IMG}" alt=""><div class="inner">
   <div><h1 class="apptitle">스토리 중국어</h1><p class="tagline">이야기 속에서 <span>말하며</span> 배우는 중국어</p></div>
   <div class="dialog" style="text-align:center;align-items:center">
    <p class="muted" style="margin:0">학교 구글 계정이나 개인 구글 계정으로 로그인하세요.</p>
    <button class="btn" id="glogin" style="display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line)">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Google 계정으로 로그인</button>
    ${err?`<div class="note">${err}</div>`:""}
    <p class="muted" style="font-size:12px">학습 기록은 내 계정에 저장되고, 담당 교수님이 확인할 수 있어요.</p>
  </div></div></div>`;
  if(!err) revealCover($("#splash"));
  $("#glogin").onclick=async()=>{
    const provider=new firebase.auth.GoogleAuthProvider();
    try{ await fb.auth.signInWithPopup(provider); }
    catch(e){
      if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){ try{ await fb.auth.signInWithRedirect(provider); return }catch(e2){} }
      if(e.code==="auth/unauthorized-domain") showLogin("이 주소가 Firebase의 승인된 도메인에 등록되지 않았어요. Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 이 사이트 주소를 추가해 주세요.");
      else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") showLogin("로그인하지 못했어요. 잠시 후 다시 시도해 주세요. ("+e.code+")");
    }
  };
}
function boot(){
  try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
  const canCloud=!!(FIREBASE_CONFIG&&window.firebase&&location.protocol.startsWith("http"));
  if(!canCloud){ render(); if(!S.name) openSetup(false); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  fb={auth:firebase.auth(),db:firebase.firestore()};
  const uc=$("#userchip");
  uc.onclick=async()=>{stopListening(true);await fb.auth.signOut();};
  app.innerHTML="";
  fb.auth.onAuthStateChanged(async u=>{
    user=u;
    if(!u){ S=freshState(); route="home"; const tb=document.querySelector('#nav [data-go="teacher"]'); if(tb) tb.remove(); $("#userchip").hidden=true; app.innerHTML=""; showLogin(); return; }
    layer.innerHTML="";
    app.innerHTML=`<section class="view"><p class="muted">기록을 불러오는 중…</p></section>`;
    try{
      const snap=await fb.db.collection("users").doc(u.uid).get();
      S=Object.assign(freshState(), snap.exists&&snap.data().state?snap.data().state:{});
    }catch(e){ S=freshState(); toast("기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); }
    if(!S.eps) S.eps={};
    if(!S.name) S.name=u.displayName||"";
    route="home"; render();
    if(!S.sid||!S.dept) openSetup(false);
  });
}
boot();
</script>
